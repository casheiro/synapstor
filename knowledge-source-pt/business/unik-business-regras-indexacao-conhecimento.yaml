id: unik-business-regras-indexacao-conhecimento
title: Regras de Negócio para Indexação e Armazenamento de Conhecimento
domain: business
type: business_rule
context: implementation
language: pt_BR
content: |
  Regras de negócio que governam como o Synapstor indexa, processa e armazena conteúdo de conhecimento para recuperação otimizada.
  
  ## Regras de Processamento de Conteúdo
  
  1. **Padrões de Filtragem de Arquivo**: Respeitar regras .gitignore para prevenir indexação de:
     - Artefatos de build e saídas compiladas
     - Arquivos temporários e caches
     - Arquivos de configuração de IDE
     - Credenciais de segurança e secrets
     - Arquivos binários (detectados automaticamente)
  
  2. **Geração de ID Determinístico**: Gerar IDs consistentes e determinísticos para documentos para:
     - Prevenir indexação duplicada
     - Habilitar atualizações confiáveis de conteúdo
     - Suportar rastreamento de versão
     - Manter integridade referencial
  
  3. **Otimização de Processamento Paralelo**: Configurar threads de worker baseadas nas capacidades do sistema para:
     - Maximizar throughput de indexação
     - Prevenir esgotamento de recursos do sistema
     - Manter experiência responsiva do usuário
     - Escalar com hardware disponível
  
  4. **Limitações de Tamanho de Arquivo**: Aplicar limites razoáveis de tamanho de arquivo para:
     - Prevenir overconsumption de memória
     - Manter qualidade de embedding
     - Garantir performance responsiva de busca
     - Controlar custos de armazenamento
  
  ## Regras de Processamento Específicas do MEF
  
  5. **Detecção Automática do MEF**: Identificar documentos MEF por:
     - Extensão de arquivo YAML (.yaml, .yml)
     - Presença de campos MEF obrigatórios
     - Formato de ID UKI válido (unik-*)
  
  6. **Enriquecimento de Metadados**: Enriquecer documentos MEF com:
     - Metadados específicos de domínio para filtragem
     - Tags de intenção e caso de uso para busca semântica
     - Mapeamentos de relacionamento para grafos de conhecimento
     - Tags de idioma para internacionalização
  
  7. **Integração de Validação**: Aplicar regras de validação MEF durante indexação:
     - Avisar ou rejeitar documentos malformados
     - Garantir conformidade de schema
     - Manter padrões de qualidade de dados
  
  ## Regras de Otimização de Armazenamento
  
  8. **Eficiência de Embedding Vetorial**: Otimizar geração de embedding por:
     - Usar modelos apropriados para tipo de conteúdo
     - Cache de embeddings para conteúdo inalterado
     - Processamento em lote para performance
     - Suporte a múltiplos provedores de embedding
  
  9. **Gestão de Coleção**: Organizar conteúdo indexado por:
     - Nomenclatura de coleção baseada em projeto
     - Isolamento de namespace para diferentes domínios
     - Atualizações de conteúdo conscientes de versão
     - Organização orientada por metadados
  
  ## Entrega de Valor de Negócio
  
  - **Qualidade de Busca**: Busca semântica de alta precisão através de preparação adequada de conteúdo
  - **Eficiência de Custo**: Processamento otimizado reduz overhead computacional
  - **Integridade de Dados**: Processamento consistente garante recuperação confiável de conhecimento
  - **Escalabilidade**: Processamento paralelo suporta bases de conhecimento em crescimento

examples:
  - input: "Projeto grande com mais de 10.000 arquivos precisa de indexação"
    output: "Workers paralelos processam arquivos respeitando .gitignore, gerando IDs determinísticos para armazenamento eficiente"
  - input: "Documento MEF com estrutura inválida encontrado"
    output: "Regras de validação aplicadas: aviso registrado no modo permissivo, documento rejeitado no modo rigoroso"
  - input: "Arquivo binário detectado durante processo de indexação"
    output: "Detecção automática pula arquivo binário, foca processamento apenas em conteúdo textual"

