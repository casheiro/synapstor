id: unik-business-regras-validacao-mef
title: Regras de Negócio para Validação do Matrix Embedding Framework
domain: business
type: business_rule
context: implementation
language: pt_BR
content: |
  Regras de negócio que governam a validação de documentos MEF (Matrix Embedding Framework) dentro do Synapstor.
  
  ## Regras Centrais de Validação
  
  1. **Validação de Estrutura de Documento**: Todos os documentos MEF devem seguir a estrutura YAML prescrita com campos obrigatórios: id, title, domain, type e content.
  
  2. **Aplicação de Formato de ID**: IDs de documentos devem seguir o padrão "unik-[dominio]-[slug-descritivo]" onde o domínio deve corresponder a um dos domínios suportados (product, business, technical, strategy, culture).
  
  3. **Categorização por Domínio**: Cada UKI deve ser categorizada em exatamente um dos cinco domínios:
     - product: Funcionalidades do produto, UX/UI, fluxos de usuário
     - business: Regras de negócio, processos, estratégias
     - technical: Código, arquitetura, infraestrutura
     - strategy: Decisões de alto nível, planejamento
     - culture: Processos, metodologia, práticas de equipe
  
  4. **Classificação de Tipo**: O conteúdo deve ser classificado como um dos sete tipos: business_rule, function, template, guideline, pattern, decision ou example.
  
  5. **Atribuição de Contexto**: Cada UKI deve especificar seu contexto de uso entre: discovery, implementation, refinement, qa, documentation ou support.
  
  6. **Especificação de Idioma**: O idioma do conteúdo deve ser especificado usando códigos ISO (pt_BR, en_US, etc.) com fallback padrão para en_US.
  
  ## Modos de Aplicação de Validação
  
  - **Modo Permissivo** (MEF_ENFORCE_STRUCTURE=false): Avisos para documentos não conformes mas permite indexação
  - **Modo Rigoroso** (MEF_ENFORCE_STRUCTURE=true): Rejeita documentos não conformes completamente
  
  ## Impacto no Negócio
  
  Essas regras de validação garantem:
  - Estrutura de conhecimento consistente entre equipes
  - Capacidades de busca semântica aprimoradas
  - Melhor compreensão contextual por LLMs
  - Controle de qualidade e governança
  - Práticas padronizadas de gestão do conhecimento

examples:
  - input: "Documento MEF sem campo 'type' obrigatório"
    output: "Erro de validação no modo permissivo: aviso registrado, documento indexado com tipo padrão. No modo rigoroso: documento rejeitado."
  - input: "ID de documento 'meu-padrão' sem prefixo 'unik-'"
    output: "Falha de validação: ID deve começar com 'unik-' e seguir formato 'unik-[dominio]-[slug]'"
  - input: "Documento com domínio 'customizado' não na lista suportada"
    output: "Erro de validação de domínio: deve ser um de [product, business, technical, strategy, culture]"

