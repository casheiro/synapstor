id: unik-culture-padrao-commits-convencionais
title: Padrão de Conventional Commits e Releases Automatizados
domain: culture
type: guideline
context: implementation
language: pt_BR
content: |
  Diretrizes da equipe para usar o padrão Conventional Commits para habilitar versionamento automatizado, geração de changelog e práticas de desenvolvimento consistentes.
  
  ## Formato de Mensagem de Commit
  
  ### Estrutura Padrão
  ```
  <tipo>(<escopo opcional>): <descrição>
  
  <corpo opcional>
  
  <rodapé opcional>
  ```
  
  ### Tipos de Commit
  - **feat**: Nova funcionalidade para usuários (dispara bump de versão MINOR)
  - **fix**: Correção de bug para usuários (dispara bump de versão PATCH)
  - **docs**: Mudanças apenas na documentação
  - **style**: Formatação de código, pontos e vírgulas, etc. (sem mudanças de lógica)
  - **refactor**: Reestruturação de código sem mudanças de comportamento
  - **test**: Adicionando ou atualizando testes
  - **chore**: Processo de build, dependências, ferramentas
  - **perf**: Melhorias de performance
  
  ### Breaking Changes
  Adicionar `!` após tipo/escopo OU incluir `BREAKING CHANGE:` no rodapé (dispara bump de versão MAJOR):
  ```
  feat!: remove suporte ao Python 3.9
  
  # OU
  
  feat: adiciona novo sistema de autenticação
  
  BREAKING CHANGE: tokens de autenticação antigos não são mais válidos
  ```
  
  ## Diretrizes de Escopo
  
  ### Escopos Recomendados
  - **core**: Funcionalidade central do Synapstor
  - **mef**: Recursos do Matrix Embedding Framework
  - **mcp**: Implementação do Model Context Protocol
  - **cli**: Mudanças na interface de linha de comando
  - **server**: Mudanças no servidor e camada de transporte
  - **i18n**: Atualizações de internacionalização
  - **embeddings**: Funcionalidade de provedor de embedding
  - **qdrant**: Mudanças na integração Qdrant
  
  ### Padrões de Uso de Escopo
  ```bash
  feat(mef): adiciona validação para relacionamentos UKI
  fix(cli): resolve problema de relatório de progresso do indexador
  docs(mcp): atualiza exemplos de integração
  refactor(embeddings): simplifica factory de provedores
  ```
  
  ## Processo de Release Automatizado
  
  ### Regras de Bump de Versão
  1. **MAJOR (1.0.0)**: Breaking changes (`feat!`, `fix!`, ou `BREAKING CHANGE:`)
  2. **MINOR (0.1.0)**: Novas funcionalidades (`feat`)
  3. **PATCH (0.0.1)**: Correções de bug (`fix`)
  4. **Sem Bump**: Documentação, style, refactor, test, chore
  
  ### Geração de Changelog
  - **Funcionalidades**: Listadas sob seção "✨ Funcionalidades"
  - **Correções de Bug**: Listadas sob seção "🐛 Correções de Bug"
  - **Breaking Changes**: Destacadas em seção especial com orientação de migração
  - **Performance**: Listadas sob "⚡ Melhorias de Performance"
  - **Documentação**: Listadas sob "📚 Documentação"
  
  ### Fluxo de Release
  1. **Merge para Main**: Pull request mergeado com mensagens de commit convencionais
  2. **Análise Automatizada**: Semantic-release analisa histórico de commits
  3. **Cálculo de Versão**: Determina próxima versão baseada em tipos de commit
  4. **Atualização de Changelog**: Gera/atualiza CHANGELOG.md
  5. **Criação de Tag**: Cria tag Git com nova versão
  6. **Publicação de Pacote**: Publica no PyPI (se configurado)
  7. **Notas de Release**: Release GitHub criado com conteúdo do changelog
  
  ## Padrões de Qualidade
  
  ### Qualidade de Mensagem de Commit
  - **Descrição Clara**: Descrever o que mudou, não como
  - **Modo Imperativo**: "Adiciona funcionalidade" não "Adicionou funcionalidade"
  - **Conciso**: Manter descrição sob 50 caracteres quando possível
  - **Específico**: Evitar termos vagos como "corrige coisas" ou "atualiza código"
  
  ### Bons Exemplos
  ```bash
  feat(mef): adiciona suporte para UKIs multi-idioma
  fix(cli): resolve vazamento de memória na indexação de arquivos grandes
  docs: atualiza exemplos de fluxo de trabalho de autoria MEF
  refactor(qdrant): extrai gestão de conexão para classe separada
  ```
  
  ### Exemplos Ruins (a evitar)
  ```bash
  fix: coisas
  update: arquivos
  feat: mudanças
  trabalho em progresso
  ```
  
  ## Práticas de Equipe
  
  ### Integração com Revisão de Código
  - **Títulos de PR**: Devem seguir formato de commit convencional
  - **Squash and Merge**: Manter histórico de commit limpo com mensagens convencionais adequadas
  - **Estratégia de Rebase**: Quando múltiplos commits, garantir que cada um siga formato convencional
  - **Validação de Mensagem**: Usar commitizen ou pre-commit hooks para validar formato
  
  ### Fluxo de Desenvolvimento
  1. **Branches de Feature**: Criar nomes de branch descritivos
  2. **Commits Convencionais**: Escrever mensagens de commit adequadas durante desenvolvimento
  3. **Revisão de PR**: Garantir que título de PR siga formato convencional
  4. **Merge**: Squash merge com mensagem de commit convencional
  
  ### Integração de Ferramentas
  - **Commitizen**: Ferramenta interativa para criar commits convencionais
  - **Pre-commit Hooks**: Validar formato de mensagem de commit
  - **GitHub Actions**: Pipeline de release automatizado
  - **Semantic Release**: Versionamento e changelog automatizados
  
  ## Migração de Commits Legados
  
  ### Período de Transição
  - **Educação**: Treinamento da equipe em commits convencionais
  - **Configuração de Ferramentas**: Instalar commitizen e pre-commit hooks
  - **Adoção Gradual**: Permitir formato misto durante transição
  - **Aplicação**: Aumentar gradualmente rigor de aplicação
  
  ### Tratamento Histórico
  - **Commits Anteriores**: Deixar commits existentes como estão
  - **Novo Começo**: Iniciar commits convencionais a partir de data específica
  - **Releases Manuais**: Tratar versões pré-transição manualmente
  - **Documentação**: Marcar claramente ponto de transição no changelog

examples:
  - input: "Desenvolvedor adiciona nova funcionalidade de validação MEF"
    output: "feat(mef): adiciona validação abrangente de estrutura UKI com relatório de erro"
  - input: "Bug encontrado no relatório de progresso da CLI"
    output: "fix(cli): resolve cálculo incorreto de porcentagem de progresso durante indexação"
  - input: "Mudança breaking remove suporte ao Python 3.9"
    output: "feat!: atualiza versão mínima do Python para 3.10 para melhores type hints"

