id: unik-culture-praticas-internacionalizacao
title: Práticas de Desenvolvimento e Manutenção de Internacionalização
domain: culture
type: guideline
context: implementation
language: pt_BR
content: |
  Práticas da equipe e diretrizes para desenvolver, manter e estender suporte de internacionalização (i18n) através dos componentes Synapstor.
  
  ## Princípios Centrais de I18n
  
  ### Filosofia de Suporte a Idiomas
  1. **Idiomas Primários**: Português (pt_BR) e inglês (en_US) como cidadãos de primeira classe
  2. **Estratégia de Fallback**: Inglês como fallback universal para traduções ausentes
  3. **Adaptação Cultural**: Considerar contexto cultural, não apenas tradução literal
  4. **Escolha do Usuário**: Respeitar preferências de idioma do usuário através de variáveis de ambiente
  
  ### Padrões de Implementação
  - **Nomenclatura Consistente de Chaves**: Usar chaves de tradução hierárquicas e descritivas
  - **Preservação de Contexto**: Manter informações de contexto para tradutores
  - **Suporte a Variáveis**: Usar sintaxe `{variavel}` para inserção de conteúdo dinâmico
  - **Thread Safety**: Garantir que sistema de tradução funcione em ambientes concorrentes
  
  ## Fluxo de Desenvolvimento
  
  ### Adicionando Novo Conteúdo Traduzível
  1. **Identificar Texto**: Marcar todo texto voltado ao usuário para tradução
  2. **Criar Chaves**: Usar chaves descritivas e hierárquicas (ex: `cli.indexer.progress.starting`)
  3. **Adicionar aos Arquivos**: Atualizar arquivos de tradução `en.json` e `pt.json`
  4. **Usar Tradutor**: Implementar usando função `get_translator()`
  5. **Testar Ambos Idiomas**: Verificar funcionalidade em ambos idiomas suportados
  
  ### Estrutura de Chave de Tradução
  ```json
  {
    "modulo": {
      "componente": {
        "acao": {
          "mensagem": "Texto traduzível com suporte a {variavel}"
        }
      }
    }
  }
  ```
  
  ### Padrão de Implementação de Código
  ```python
  from synapstor.i18n import get_translator
  
  def alguma_funcao():
      t = get_translator()
      mensagem = t("cli.indexer.progress.starting", nome_projeto="MeuProjeto")
      print(mensagem)
  ```
  
  ## Gestão de Tradução
  
  ### Organização de Arquivos
  - **Localização**: `src/synapstor/i18n/translations/`
  - **Nomenclatura**: `{codigo_idioma}.json` (ex: `en.json`, `pt.json`)
  - **Estrutura**: JSON hierárquico com objetos aninhados para organização
  - **Codificação**: Codificação UTF-8 para todos os arquivos de tradução
  
  ### Garantia de Qualidade
  1. **Verificação de Completude**: Garantir que todas as chaves existam em todos os arquivos de idioma
  2. **Consistência de Variáveis**: Verificar que placeholders de variável correspondem entre idiomas
  3. **Revisão de Contexto**: Validar que traduções fazem sentido no contexto de uso real
  4. **Revisão de Falante Nativo**: Ter falantes nativos revisem traduções para precisão
  
  ### Processo de Atualização de Tradução
  1. **Mudanças de Fonte**: Quando texto em inglês muda, atualizar chave de tradução
  2. **Atualizações em Lote**: Agrupar atualizações de tradução para eficiência
  3. **Ciclo de Revisão**: Revisão regular de qualidade e completude de tradução
  4. **Rastreamento de Versão**: Rastrear atualizações de tradução no controle de versão
  
  ## Considerações Culturais
  
  ### Adaptações para Português (Brasil)
  - **Formal vs. Informal**: Usar nível apropriado de formalidade para documentação técnica
  - **Termos Técnicos**: Equilibrar entre termos técnicos em inglês e equivalentes em português
  - **Formatos de Data/Hora**: Usar convenções brasileiras (DD/MM/AAAA)
  - **Contexto Cultural**: Adaptar exemplos e metáforas para contexto brasileiro
  
  ### Padrões para Inglês (EUA)
  - **Escrita Técnica**: Estilo claro e conciso de comunicação técnica
  - **Consistência**: Manter terminologia consistente através de todos os componentes
  - **Acessibilidade**: Usar linguagem inclusiva e explicações claras
  - **Audiência Internacional**: Considerar falantes não nativos de inglês
  
  ## Diretrizes de CLI e Interface de Usuário
  
  ### Interfaces de Linha de Comando
  - **Texto de Ajuda**: Traduzir todas as mensagens de ajuda, descrições e mensagens de erro
  - **Indicadores de Progresso**: Localizar mensagens de progresso e atualizações de status
  - **Mensagens de Erro**: Fornecer mensagens de erro claras e acionáveis no idioma do usuário
  - **Exemplos**: Usar exemplos culturalmente apropriados na documentação de ajuda
  
  ### Configuração e Ambiente
  - **Variáveis de Ambiente**: Usar `SYNAPSTOR_LANGUAGE` para seleção de idioma
  - **Auto-detecção**: Suporte a detecção automática de idioma quando possível
  - **Capacidade de Override**: Permitir override explícito de idioma em todos os contextos
  - **Documentação**: Documentar configuração de idioma em múltiplos idiomas
  
  ## Testes e Validação
  
  ### Testes Automatizados
  - **Carregamento de Tradução**: Testar carregamento e parsing de arquivo de tradução
  - **Existência de Chave**: Verificar que todas as chaves de tradução usadas existem
  - **Substituição de Variável**: Testar inserção de conteúdo dinâmico
  - **Comportamento de Fallback**: Validar fallback para inglês quando traduções estão ausentes
  
  ### Processo de Teste Manual
  1. **Teste de Fluxo Completo**: Testar fluxos completos de usuário em ambos idiomas
  2. **Validação de Caso Extremo**: Testar com traduções ausentes e casos extremos
  3. **Revisão Cultural**: Validar adequação cultural de traduções
  4. **Experiência do Usuário**: Garantir fluxo natural em interfaces traduzidas
  
  ## Extensão e Idiomas Futuros
  
  ### Adicionando Novos Idiomas
  1. **Pesquisa de Mercado**: Validar demanda por suporte a novo idioma
  2. **Criação de Arquivo de Tradução**: Criar novo arquivo JSON de idioma
  3. **Registro de Código de Idioma**: Adicionar idioma à lista de idiomas suportados
  4. **Garantia de Qualidade**: Estabelecer processo de QA para novo idioma
  5. **Engajamento Comunitário**: Engajar comunidade de falantes nativos para suporte contínuo
  
  ### Contribuições Comunitárias
  - **Diretrizes de Tradução**: Fornecer diretrizes claras para tradutores comunitários
  - **Processo de Revisão**: Estabelecer processo de revisão para traduções contribuídas pela comunidade
  - **Reconhecimento**: Reconhecer e creditar contribuidores de tradução comunitários
  - **Acesso a Ferramentas**: Fornecer ferramentas e recursos para contribuidores de tradução
  
  ## Manutenção e Evolução
  
  ### Tarefas de Manutenção Regulares
  - **Auditorias de Tradução**: Auditorias regulares de completude e qualidade
  - **Atualizações de Terminologia**: Manter terminologia técnica atual
  - **Integração de Feedback do Usuário**: Incorporar feedback do usuário sobre traduções
  - **Monitoramento de Performance**: Monitorar impacto de performance do sistema i18n
  
  ### Estratégia de Evolução
  - **Expansão Gradual**: Adicionar suporte de idioma baseado em demanda do usuário
  - **Atualizações de Tecnologia**: Manter infraestrutura i18n atual com melhores práticas
  - **Melhoria de Integração**: Melhorar integração com fluxo de desenvolvimento
  - **Construção de Comunidade**: Construir comunidade ativa de tradutores para sustentabilidade

examples:
  - input: "Desenvolvedor adiciona novo comando CLI com texto de ajuda"
    output: "Cria chaves de tradução em en.json e pt.json, implementa usando tradutor com hierarquia adequada de chaves"
  - input: "Usuário reporta mensagem de erro confusa em português"
    output: "Revisar contexto de tradução, melhorar clareza, atualizar pt.json e testar com falantes nativos"
  - input: "Voluntário comunitário oferece suporte de tradução para espanhol"
    output: "Fornecer diretrizes de tradução, criar template es.json, estabelecer processo de revisão com comunidade"

