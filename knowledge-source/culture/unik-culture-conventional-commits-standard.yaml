id: unik-culture-conventional-commits-standard
title: Conventional Commits and Automated Release Standards
domain: culture
type: guideline
context: implementation
language: en_US
content: |
  Team guidelines for using Conventional Commits standard to enable automated versioning, changelog generation, and consistent development practices.
  
  ## Commit Message Format
  
  ### Standard Structure
  ```
  <type>(<scope optional>): <description>
  
  <body optional>
  
  <footer optional>
  ```
  
  ### Commit Types
  - **feat**: New feature for users (triggers MINOR version bump)
  - **fix**: Bug fix for users (triggers PATCH version bump)  
  - **docs**: Documentation changes only
  - **style**: Code formatting, semicolons, etc. (no logic changes)
  - **refactor**: Code restructuring without behavior changes
  - **test**: Adding or updating tests
  - **chore**: Build process, dependencies, tools
  - **perf**: Performance improvements
  
  ### Breaking Changes
  Add `!` after type/scope OR include `BREAKING CHANGE:` in footer (triggers MAJOR version bump):
  ```
  feat!: remove Python 3.9 support
  
  # OR
  
  feat: add new authentication system
  
  BREAKING CHANGE: old auth tokens are no longer valid
  ```
  
  ## Scope Guidelines
  
  ### Recommended Scopes
  - **core**: Core Synapstor functionality
  - **mef**: Matrix Embedding Framework features
  - **mcp**: Model Context Protocol implementation
  - **cli**: Command-line interface changes
  - **server**: Server and transport layer changes
  - **i18n**: Internationalization updates
  - **embeddings**: Embedding provider functionality
  - **qdrant**: Qdrant integration changes
  
  ### Scope Usage Patterns
  ```bash
  feat(mef): add validation for UKI relationships
  fix(cli): resolve indexer progress reporting issue
  docs(mcp): update integration examples
  refactor(embeddings): simplify provider factory
  ```
  
  ## Automated Release Process
  
  ### Version Bumping Rules
  1. **MAJOR (1.0.0)**: Breaking changes (`feat!`, `fix!`, or `BREAKING CHANGE:`)
  2. **MINOR (0.1.0)**: New features (`feat`)
  3. **PATCH (0.0.1)**: Bug fixes (`fix`)
  4. **No Bump**: Documentation, style, refactor, test, chore
  
  ### Changelog Generation
  - **Features**: Listed under "✨ Features" section
  - **Bug Fixes**: Listed under "🐛 Bug Fixes" section
  - **Breaking Changes**: Highlighted in special section with migration guidance
  - **Performance**: Listed under "⚡ Performance Improvements"
  - **Documentation**: Listed under "📚 Documentation"
  
  ### Release Workflow
  1. **Merge to Main**: Pull request merged with conventional commit messages
  2. **Automated Analysis**: Semantic-release analyzes commit history
  3. **Version Calculation**: Determines next version based on commit types
  4. **Changelog Update**: Generates/updates CHANGELOG.md
  5. **Tag Creation**: Creates Git tag with new version
  6. **Package Publishing**: Publishes to PyPI (if configured)
  7. **Release Notes**: GitHub release created with changelog content
  
  ## Quality Standards
  
  ### Commit Message Quality
  - **Clear Description**: Describe what changed, not how
  - **Imperative Mood**: "Add feature" not "Added feature"
  - **Concise**: Keep description under 50 characters when possible
  - **Specific**: Avoid vague terms like "fix stuff" or "update code"
  
  ### Good Examples
  ```bash
  feat(mef): add support for multi-language UKIs
  fix(cli): resolve memory leak in large file indexing
  docs: update MEF authoring workflow examples
  refactor(qdrant): extract connection management to separate class
  ```
  
  ### Poor Examples (to avoid)
  ```bash
  fix: stuff
  update: files
  feat: changes
  work in progress
  ```
  
  ## Team Practices
  
  ### Code Review Integration
  - **PR Titles**: Should follow conventional commit format
  - **Squash and Merge**: Maintain clean commit history with proper conventional messages
  - **Rebase Strategy**: When multiple commits, ensure each follows conventional format
  - **Message Validation**: Use commitizen or pre-commit hooks to validate format
  
  ### Development Workflow
  1. **Feature Branches**: Create descriptive branch names
  2. **Conventional Commits**: Write proper commit messages during development
  3. **PR Review**: Ensure PR title follows conventional format
  4. **Merge**: Squash merge with conventional commit message
  
  ### Tooling Integration
  - **Commitizen**: Interactive tool for creating conventional commits
  - **Pre-commit Hooks**: Validate commit message format
  - **GitHub Actions**: Automated release pipeline
  - **Semantic Release**: Automated versioning and changelog
  
  ## Migration from Legacy Commits
  
  ### Transitioning Period
  - **Education**: Team training on conventional commits
  - **Tooling Setup**: Install commitizen and pre-commit hooks
  - **Gradual Adoption**: Allow mixed format during transition
  - **Enforcement**: Gradually increase enforcement strictness
  
  ### Historical Handling
  - **Previous Commits**: Leave existing commits as-is
  - **Fresh Start**: Begin conventional commits from specific date
  - **Manual Releases**: Handle pre-transition versions manually
  - **Documentation**: Clearly mark transition point in changelog

examples:
  - input: "Developer adds new MEF validation feature"
    output: "feat(mef): add comprehensive UKI structure validation with error reporting"
  - input: "Bug found in CLI progress reporting"
    output: "fix(cli): resolve incorrect progress percentage calculation during indexing"
  - input: "Breaking change removes Python 3.9 support"
    output: "feat!: upgrade minimum Python version to 3.10 for better type hints"

