id: unik-product-cli-interface-design
title: Command Line Interface Design Guidelines
domain: product
type: guideline
context: implementation
language: en_US
content: |
  Design principles and guidelines for creating consistent, user-friendly command-line interfaces in Synapstor.
  
  ## Core Design Principles
  
  1. **Unified Control Interface**: Use `synapstor-ctl` as the primary entry point for all operations to reduce cognitive load and provide consistent user experience.
  
  2. **Progressive Disclosure**: Start with simple commands and provide additional options through flags and subcommands.
  
  3. **Consistent Naming Convention**: Follow predictable patterns:
     - Action-oriented verbs (start, stop, index, reindex)
     - Clear, descriptive flags (--project, --path, --verbose)
     - Hierarchical subcommands (ctl start, ctl indexer)
  
  4. **Helpful Defaults**: Provide sensible defaults that work for most use cases while allowing customization when needed.
  
  ## Command Structure Patterns
  
  ### Primary Commands
  ```bash
  synapstor-ctl start      # Start MCP server
  synapstor-ctl stop       # Stop MCP server  
  synapstor-ctl status     # Show system status
  synapstor-ctl setup      # Interactive configuration
  ```
  
  ### Subcommands with Context
  ```bash
  synapstor-ctl indexer --project name --path /path
  synapstor-ctl reindex --project name
  synapstor-ctl logs --follow
  ```
  
  ### Specialized Tools (Legacy Support)
  ```bash
  synapstor-server      # Direct server control
  synapstor-indexer     # Direct indexing tool
  synapstor-config      # Configuration management
  ```
  
  ## User Experience Guidelines
  
  1. **Clear Error Messages**: Provide actionable error messages with suggested solutions
  2. **Progress Indicators**: Show progress for long-running operations
  3. **Confirmation Prompts**: Request confirmation for destructive operations
  4. **Help Documentation**: Comprehensive --help output for all commands
  5. **Color Coding**: Use colors consistently (green=success, red=error, yellow=warning)
  
  ## Internationalization Standards
  
  - Support both Portuguese (pt_BR) and English (en_US) interfaces
  - Use SYNAPSTOR_LANGUAGE environment variable for language selection
  - Provide consistent translations for all user-facing text
  - Default to English for international compatibility
  
  ## Accessibility Considerations
  
  - Work effectively in both interactive and non-interactive environments
  - Support screen readers through clear text output
  - Provide alternative text-based progress indicators
  - Ensure keyboard-only operation
  
  ## Configuration Management
  
  - Support both environment variables and .env files
  - Provide interactive setup for first-time users
  - Allow configuration validation and testing
  - Clear documentation of all configuration options

examples:
  - input: "New user wants to start using Synapstor"
    output: "synapstor-ctl setup guides through configuration, then synapstor-ctl start launches the service"
  - input: "Developer needs to index a large project"
    output: "synapstor-ctl indexer --project myapp --path ./src --verbose provides progress feedback and detailed logging"
  - input: "User encounters configuration error"
    output: "Clear error message with specific file path and suggested configuration fix"

