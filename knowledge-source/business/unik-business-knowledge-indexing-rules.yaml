id: unik-business-knowledge-indexing-rules
title: Knowledge Indexing and Storage Business Rules
domain: business
type: business_rule
context: implementation
language: en_US
content: |
  Business rules governing how Synapstor indexes, processes, and stores knowledge content for optimal retrieval.
  
  ## Content Processing Rules
  
  1. **File Filtering Standards**: Respect .gitignore rules to prevent indexing of:
     - Build artifacts and compiled outputs
     - Temporary files and caches
     - IDE configuration files
     - Security credentials and secrets
     - Binary files (automatically detected)
  
  2. **Deterministic ID Generation**: Generate consistent, deterministic IDs for documents to:
     - Prevent duplicate indexing
     - Enable reliable content updates
     - Support version tracking
     - Maintain referential integrity
  
  3. **Parallel Processing Optimization**: Configure worker threads based on system capabilities to:
     - Maximize indexing throughput
     - Prevent system resource exhaustion
     - Maintain responsive user experience
     - Scale with available hardware
  
  4. **File Size Limitations**: Enforce reasonable file size limits to:
     - Prevent memory overconsumption
     - Maintain embedding quality
     - Ensure responsive search performance
     - Control storage costs
  
  ## MEF-Specific Processing Rules
  
  5. **Automatic MEF Detection**: Identify MEF documents by:
     - YAML file extension (.yaml, .yml)
     - Presence of required MEF fields
     - Valid UKI ID format (unik-*)
  
  6. **Metadata Enhancement**: Enrich MEF documents with:
     - Domain-specific metadata for filtering
     - Intent and use case tags for semantic search
     - Relationship mappings for knowledge graphs
     - Language tags for internationalization
  
  7. **Validation Integration**: Apply MEF validation rules during indexing:
     - Warn or reject malformed documents
     - Ensure schema compliance
     - Maintain data quality standards
  
  ## Storage Optimization Rules
  
  8. **Vector Embedding Efficiency**: Optimize embedding generation by:
     - Using appropriate models for content type
     - Caching embeddings for unchanged content
     - Batch processing for performance
     - Supporting multiple embedding providers
  
  9. **Collection Management**: Organize indexed content by:
     - Project-based collection naming
     - Namespace isolation for different domains
     - Version-aware content updates
     - Metadata-driven organization
  
  ## Business Value Delivery
  
  - **Search Quality**: High-precision semantic search through proper content preparation
  - **Cost Efficiency**: Optimized processing reduces computational overhead
  - **Data Integrity**: Consistent processing ensures reliable knowledge retrieval
  - **Scalability**: Parallel processing supports growing knowledge bases

examples:
  - input: "Large project with 10,000+ files needs indexing"
    output: "Parallel workers process files respecting .gitignore, generating deterministic IDs for efficient storage"
  - input: "MEF document with invalid structure encountered"
    output: "Validation rules applied: warning logged in permissive mode, document rejected in strict mode"
  - input: "Binary file detected during indexing process"
    output: "Automatic detection skips binary file, focuses processing on textual content only"

