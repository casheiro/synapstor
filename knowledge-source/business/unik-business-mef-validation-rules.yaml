id: unik-business-mef-validation-rules
title: Matrix Embedding Framework Validation Business Rules
domain: business
type: business_rule
context: implementation
language: en_US
content: |
  Business rules governing the validation of MEF (Matrix Embedding Framework) documents within Synapstor.
  
  ## Core Validation Rules
  
  1. **Document Structure Validation**: All MEF documents must follow the prescribed YAML structure with required fields: id, title, domain, type, and content.
  
  2. **ID Format Enforcement**: Document IDs must follow the pattern "unik-[domain]-[descriptive-slug]" where domain matches one of the supported domains (product, business, technical, strategy, culture).
  
  3. **Domain Categorization**: Each UKI must be categorized into exactly one of five domains:
     - product: Product features, UX/UI, user flows
     - business: Business rules, processes, strategies  
     - technical: Code, architecture, infrastructure
     - strategy: High-level decisions, planning
     - culture: Processes, methodology, team practices
  
  4. **Type Classification**: Content must be classified as one of seven types: business_rule, function, template, guideline, pattern, decision, or example.
  
  5. **Context Assignment**: Each UKI must specify its usage context from: discovery, implementation, refinement, qa, documentation, or support.
  
  6. **Language Specification**: Content language must be specified using ISO codes (pt_BR, en_US, etc.) with default fallback to en_US.
  
  ## Validation Enforcement Modes
  
  - **Permissive Mode** (MEF_ENFORCE_STRUCTURE=false): Warnings for non-compliant documents but allows indexing
  - **Strict Mode** (MEF_ENFORCE_STRUCTURE=true): Rejects non-compliant documents entirely
  
  ## Business Impact
  
  These validation rules ensure:
  - Consistent knowledge structure across teams
  - Improved semantic search capabilities
  - Better LLM contextual understanding
  - Quality control and governance
  - Standardized knowledge management practices

examples:
  - input: "MEF document with missing 'type' field"
    output: "Validation error in permissive mode: warning logged, document indexed with default type. In strict mode: document rejected."
  - input: "Document ID 'my-pattern' without 'unik-' prefix"
    output: "Validation failure: ID must start with 'unik-' and follow format 'unik-[domain]-[slug]'"
  - input: "Document with domain 'custom' not in supported list"
    output: "Domain validation error: must be one of [product, business, technical, strategy, culture]"

